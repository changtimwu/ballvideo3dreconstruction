<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>匹克球 3D 重建</title>
<!--
  Video list. videos.json is generated by tools/build_site.py in GitHub CI from
  videos/<id>/meta.json; each entry opens viewer.html?v=<id>.
-->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg: #070b0a; --panel: #0d1412; --panel-2: #121c19; --line: #1f2d29; --text: #e7efe9; --muted: #8aa39a; --accent: #d9f24a; }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: #3a5048; transform: translateY(-2px); }
  .card:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 14px; border-radius: 9px; font-size: 13px;
         border: 1px solid var(--line); background: var(--panel-2); color: var(--text); white-space: nowrap; }
  .btn:hover { background: #18251f; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  .btn-primary:hover { background: #e4f76e; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="min-h-screen">
<header class="max-w-6xl mx-auto px-4 sm:px-6 pt-10 pb-6">
  <h1 class="text-2xl sm:text-3xl font-semibold tracking-wide">匹克球 3D 重建</h1>
  <p class="mt-2 text-sm" style="color: var(--muted)">從 YouTube 比賽影片重建球員與球的 3D 軌跡。選擇一段影片，進入 3D 與原始影片的對照播放。</p>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 pb-16">
  <div id="status" class="text-sm" style="color: var(--muted)">載入影片列表…</div>
  <div id="grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
</main>

<footer class="max-w-6xl mx-auto px-4 sm:px-6 pb-10 text-xs" style="color: var(--muted)">
  新增影片：在本機執行 <code class="mono">uv run python -m tracking analyze &lt;YouTube 連結&gt;</code>，分析結果提交後由 GitHub CI 更新此列表。
</footer>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = x => x == null ? '–' : `${Math.round(x * 100)}%`;
const dur = s => { s = Math.round(s || 0); const m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; };
const day = iso => iso ? new Date(iso).toLocaleDateString('zh-TW', { year: 'numeric', month: 'short', day: 'numeric' }) : '';

function card(v) {
  const st = v.stats || {};
  return `
  <article class="card flex flex-col">
    <a href="viewer.html?v=${encodeURIComponent(v.id)}" class="block relative aspect-video bg-black" aria-label="開啟 ${esc(v.title)} 的 3D 重建">
      <img src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/maxresdefault.jpg" alt="" loading="lazy"
           onerror="this.onerror=null; this.src='https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/mqdefault.jpg'"
           class="w-full h-full object-cover opacity-90" />
      <span class="absolute right-2 bottom-2 mono text-xs px-1.5 py-0.5 rounded" style="background: rgba(0,0,0,.75)">${dur(v.duration)}</span>
    </a>
    <div class="p-4 flex flex-col gap-3 flex-1">
      <div>
        <h2 class="font-medium leading-snug">${esc(v.title || v.id)}</h2>
        <p class="text-xs mt-1" style="color: var(--muted)">${esc(v.channel || '')}${v.analysed_at ? ` · 分析於 ${day(v.analysed_at)}` : ''}</p>
      </div>
      <div class="flex flex-wrap gap-1.5">
        <span class="chip" title="四名球員同時被追蹤到的影格比例">球員 ${pct(st.players_all_visible)}</span>
        <span class="chip" title="有 3D 球位置的影格比例">球 ${pct(st.ball_visible)}</span>
        <span class="chip">擊球 ${st.hits ?? '–'}</span>
        <span class="chip">落地 ${st.bounces ?? '–'}</span>
      </div>
      <div class="mt-auto flex flex-wrap gap-2">
        <a class="btn btn-primary" href="viewer.html?v=${encodeURIComponent(v.id)}">3D 重建</a>
        <a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener">YouTube ↗</a>
        <a class="btn" href="data/${encodeURIComponent(v.id)}.json" title="追蹤資料 JSON">JSON</a>
      </div>
    </div>
  </article>`;
}

fetch('videos.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(list => {
    const vids = list.videos || [];
    const status = document.getElementById('status');
    if (!vids.length) { status.textContent = '還沒有分析過的影片。'; return; }
    status.textContent = `${vids.length} 段影片`;
    status.className = 'text-sm mb-4';
    status.style.color = 'var(--muted)';
    document.getElementById('grid').innerHTML = vids.map(card).join('');
  })
  .catch(err => { document.getElementById('status').textContent = `無法載入影片列表（${err.message}）。`; });
</script>
</body>
</html>
